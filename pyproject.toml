# ── 依赖管理与虚拟环境统一走 uv（不用 python -m venv + pip）──
# 开发机实测：uv 0.11.33；`uv sync` → `.venv` + `uv.lock`；`uv run pytest -q` → 54 passed
#
# 常用命令：
#   uv sync               建/更新 .venv 并安装依赖（默认含 dev 组）
#   uv sync --locked      CI/复现：lock 过期直接失败（推荐写进 CI 与 Dockerfile）
#   uv run python ...     在项目 .venv 里执行（免激活）
#   uv run pytest -q      跑测试
#   uv add <pkg>          加运行依赖（会同时改本文件与 uv.lock，不要手写 dependencies）
#   uv add --dev <pkg>    加 dev 依赖
#   uv lock --upgrade     升级锁定版本
#
# 为什么不用 `python -m venv`：它依赖 ensurepip 往临时目录解压捆绑 wheel，
# 在权限/安全策略受限的机器上会直接失败（venv 建出来但没有 pip，本机实测过）；uv 自己管理解释器与缓存，不经过 ensurepip。
#
# 注意：`uv run` 只保证「用项目 .venv 的解释器」，**不会**改工作目录 —— 命令仍需在仓库根执行。

[project]
name = "shopsage"
version = "0.1.0"
description = "电商企业智能助手"
# 开发机实测 3.12.9，口径统一为 3.12（不用 3.11：本机未装 3.11，且 3.12 是当前活跃版本）
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-redis>=0.5.2",
    "litellm>=1.50",
    "openai>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# 保留：给不使用 uv 的环境（例如旧 CI 用 pip）一个安装入口
dev = [
    "pytest>=8.0",
]
# 本地 embedding 后端（EMBEDDING_BACKEND=local）用：`uv sync --extra local`
# ⚠️ 刻意【不做】默认依赖：它会把 torch 拉进默认环境（约 2 GB），而默认的 API 后端（litellm）根本不需要它。
#    代码侧也必须配合：sentence_transformers 只能在函数内 import，否则没装 extras 的环境
#    连 `import app.llm` 都会失败（API 后端也跟着用不了）。
#    选型与两种后端的取舍见 docs/runbook/5.llm-runbook.md §7.2、docs/modules/5.llm.md 第 4 节第 7 条。
local = [
    "sentence-transformers>=3.0",
]

# dev 依赖的 uv 原生写法（PEP 735 依赖组）：
# `uv sync` 默认就会装上 dev 组，不需要 `--extra dev`；等价于 pip 侧的 `-e ".[dev]"`
[dependency-groups]
dev = [
    "pypdf>=6.20.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
# 显式声明工作流要求的最低 uv 版本，避免 lock 格式/依赖组语义在老版本上行为不一致
required-version = ">=0.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# async 用例（tests/test_llm_client_retry.py 的取消语义用例）走 pytest-asyncio：
# auto 模式省掉每条用例写 @pytest.mark.asyncio 的噪音
asyncio_mode = "auto"
markers = [
    # 真实厂商探活（花钱/需密钥）：默认不跑；CI 与日常用 `-m "not llm_live"` 排除
    "llm_live: 需要真实 LLM API key 的探活用例（见 tests/test_llm_live.py、docs/runbook/5.llm-runbook.md §4）",
]
