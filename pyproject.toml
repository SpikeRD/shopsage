[project]
name = "shopsage"
version = "0.1.0"
description = "电商企业智能助手"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
