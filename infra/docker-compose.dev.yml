# ShopSage 开发依赖栈（infra 第 2 步）
#
# 定位：**只起依赖服务**（postgres/pgvector、redis、prometheus、grafana），
# 业务代码跑在本机 uv 管理的 .venv（infra.md 第 4 节第 2 条：开发期代码不容器化）。
#
# 部署位置：VMware-Linux 虚拟机（本机 Windows 只跑代码，通过网络连过来）。
# 原因见 docs/modules/infra.md「跨主机拓扑」——架构第 9 节本来就是 Windows + Linux 双机。
#
# 启动（在【仓库根】执行，让 compose 读到根 .env）：
#   docker compose -f infra/docker-compose.dev.yml --project-directory . up -d
# 停止（保留数据）：      加 down
# 清空重建（连数据一起删）：docker compose ... down -v
#
# 注意：下面的 -f 与 --project-directory 两条一起用，compose 才会
#   ① 把 .env 解析到仓库根（换目录会静默丢变量替换，只剩默认值）
#   ② 让 named volume 名字稳定为 shopsage_dev_*，不随 -f 路径漂移

name: shopsage-dev

services:
  # ── PostgreSQL 16 + pgvector ────────────────────────────────────────────────
  # 用 pgvector 官方镜像而不是 postgres:16 + 启动脚本装扩展：
  # 扩展已编译进镜像，`CREATE EXTENSION vector` 开箱可用，少一层「初始化脚本失败」
  # 的隐蔽故障（第 10 步 rag.md 建向量表直接依赖它）。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopsage-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppass}
      POSTGRES_DB: ${POSTGRES_DB:-shopsage}
      # 显式钉住 locale/编码：Windows 侧客户端多为 UTF8，避免中文种子数据乱码
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      # ⚠️ 必须绑 0.0.0.0（默认值）而不是 127.0.0.1：Windows 宿主机要从外部连进来。
      # 只想放通 VMware 网段时可设 POSTGRES_BIND_IP=192.168.x.x（写进仓库根 .env）。
      - "${POSTGRES_BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # ${POSTGRES_USER:-...} 由 compose 在宿主机侧替换，不是容器内变量展开
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopuser} -d ${POSTGRES_DB:-shopsage}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [shopsage-dev]

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  # 第 9 步（api 限流）、第 14 步（Arq 队列）、第 15 步（语义缓存）都依赖它。
  redis:
    image: redis:7-alpine
    container_name: shopsage-dev-redis
    restart: unless-stopped
    # --appendonly yes：会话/队列状态要能扛住容器重启（架构第 8 节「会话外置」）
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_IP:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [shopsage-dev]

  # ── Prometheus（第 11 步 observability.md 的指标采集端）─────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: shopsage-dev-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      # 允许通过 UI 调 scrape 目标，方便第 11 步现场排查
      - "--web.enable-lifecycle"
    # ⚠️ 这里**故意不设 `environment:`**（曾经有个 SHOPSAGE_API_TARGET，已删除）：
    #    prom/prometheus:v2.55.1 **不会**替换 scrape 目标里的 `${...}` —— 配置文件的环境变量
    #    展开在 2.x 只作用于 `external_labels`（靠 expand-external-labels 特性开关），
    #    Prometheus 3.0 移除该 flag 后才成为默认行为。
    #    留着那个变量只会让人以为「改它的值就能改采集地址」，而实际完全没被读取：
    #    症状是 target 永久 down（`invalid URL escape "%7B"` 或 `invalid port ":8000%7D"`）
    #    而日志干净、配置校验也通过。采集地址现在写死在
    #    infra/prometheus/prometheus.yml 的 `targets:` 那一行。
    #    ➡️ 以后要加环境变量进这个容器，先确认目标程序**真的会读它**。
    extra_hosts:
      # 让 `host.docker.internal` 在 Linux 上也能解析（Docker Desktop 自带，原生 Linux 不自带）。
      #
      # ⚠️ 但它在**本仓的开发拓扑下不能用来指 Windows**（实测 2026-10-11）：
      #    在原生 Docker Engine 上 `host-gateway` 解析成的是 **Linux VM 自己**的网关
      #    （本栈实测 172.18.0.1），不是 Windows 开发者机。
      #    → 采集 Windows 上的业务必须写 Windows 的真实网卡 IP
      #      （实测 192.168.167.148:8000），见 infra/prometheus/prometheus.yml 末尾的拓扑说明。
      #    这条 extra_hosts 保留的意义：将来「业务也搬到 Linux 上跑」时，
      #    host.docker.internal 就等于那台 Linux，比写死网桥 IP 更耐改网络配置。
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_BIND_IP:-0.0.0.0}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # ⚠️ 路径带 infra/ 前缀是必须的：bind mount 的相对路径按【项目目录】解析，
      # 而 --project-directory . 把项目目录钉在仓库根，所以 ./prometheus/... 会指向
      # 仓库根的 prometheus/（不存在）→ Docker 自动建个空目录再挂到文件上，
      # 报 "not a directory: Are you trying to mount a directory onto a file"。
      # 改这两个路径时别丢了 --project-directory . 的对应关系（见文件头注释）。
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 第 11 步的记录规则（分 Agent 的 P99 等）。**必须挂**：
      # prometheus.yml 里写了 `rule_files: /etc/prometheus/rules/*.yml`，
      # 少了这个挂载，Prometheus 会因为「规则文件目录不存在」而在启动时**直接失败**
      # （不是警告）—— 那时整个监控栈起不来，而报错信息只提 rule_files。
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      # prom/prometheus 镜像里没有 curl，用官方自带的 promtool 探活
      test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [shopsage-dev]

  # ── OTel Collector（第 11 步的链路采集端；**可选**，默认不随栈启动）──────────
  # 为什么要它：Prometheus 回答「长期看是多少」，它**看不见单次请求的调用链** ——
  # 而「那次 P99 尖峰到底卡在哪个节点」只有 trace 能回答。
  #
  # ⚠️ 默认不启动（`profiles` 生效时才会起），因为：
  #   ① 业务默认把 span 留在进程内存里（`OTEL_ENDPOINT` 留空），起了也没人发；
  #   ② 一旦配了 `OTEL_ENDPOINT` 而 collector 没起，业务侧的 BatchSpanProcessor
  #      会不断重试连接（只打日志、不阻塞请求，但日志会变吵）。
  # 启用方式：
  #   docker compose -f infra/docker-compose.dev.yml --project-directory . --profile tracing up -d
  # 然后把 .env 的 OTEL_ENDPOINT 指向 **4318**（OTLP/HTTP）。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: shopsage-dev-otel-collector
    restart: unless-stopped
    profiles: ["tracing"]
    command: ["--config=/etc/otel/otel-collector.yml"]
    ports:
      - "${OTEL_GRPC_BIND_IP:-0.0.0.0}:${OTEL_GRPC_PORT:-4317}:4317"   # OTLP/gRPC
      - "${OTEL_HTTP_BIND_IP:-0.0.0.0}:${OTEL_HTTP_PORT:-4318}:4318"   # OTLP/HTTP（业务用这条）
      - "${OTEL_METRICS_PORT:-0.0.0.0:8888}:8888"                      # collector 自身指标
    volumes:
      - ./infra/otel/otel-collector.yml:/etc/otel/otel-collector.yml:ro
      - otel_data:/data
    healthcheck:
      # contrib 镜像里没有 curl/wget 保证，用 collector 自己的健康检查扩展不可用时，
      # 退化成「端口有没有在听」的 TCP 检查（够用：它回答「起来了没有」）。
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/tcp/127.0.0.1/4318' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [shopsage-dev]

  # ── Grafana（第 11 步的可视化端）───────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: shopsage-dev-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 开发期免登录，方便直接从 Windows 浏览器看板子
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "dark"
    ports:
      - "${GRAFANA_BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      # 用 provisioning 自动挂数据源：省掉「手点 UI 加 datasource」这一步，
      # 第 11 步验收「能从 Grafana 定位慢在哪一步」时开箱即用
      # 同样必须是 ./infra/...（原因见 prometheus 服务里的注释）；
      # 少了 infra/ 时不会报错，只会静默挂上一个空目录 → 「Grafana 没数据源」
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # ⚠️ 看板 JSON 必须位于 `/etc/grafana/provisioning/dashboards` **之内**：
      # `provisioning/dashboards/shopsage.yml` 里的 `path` 指的就是这个容器内路径。
      # 所以仓库里的看板放在 `infra/grafana/provisioning/dashboards/`（而不是另起
      # 一个 `infra/grafana/dashboards/`）—— 后者会被挂到 `/etc/grafana/dashboards`，
      # Grafana **看不到**，症状是「数据源在、看板不见了」（不报错，只是空文件夹）。
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [shopsage-dev]

networks:
  shopsage-dev:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  otel_data:
