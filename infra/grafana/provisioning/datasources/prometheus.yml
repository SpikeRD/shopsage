# Grafana 数据源自动配置：容器起来就把 Prometheus 挂好，不需要手点 UI。
# 第 12 步验收（「能从 Grafana 定位慢在哪一步」）依赖它开箱可用。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 同 compose 网络内，直接用服务名解析
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
