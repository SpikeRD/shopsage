# Prometheus 采集配置（开发环境）
#
# 关键点：Prometheus 跑在 Linux 虚拟机的容器里，而**业务代码跑在 Windows 宿主机**，
# 所以 scrape target 不能写 "localhost"（那是容器自己）。
#
# ⚠️ 那该写什么地址？**不要凭记忆写「宿主机=172.17.0.1」** —— 这句话只在
#    「业务也在 Linux VM 上、且容器在默认 bridge（docker0）里」时才成立。
#    本仓的开发拓扑是【Windows 开发者机 + 独立的 Linux 依赖机】两台机器，
#    此时唯一正确的地址是 **Windows 在 VMware 网段上的那张网卡 IP**（本仓实测 192.168.1.13，
#    见文件末尾的「本机实测拓扑」）。取法（在 Windows 上执行）：
#      Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' }
#    判据是它必须与 Linux 的 `ip -4 -o addr show` 里 ens33/eth0 那张网卡**在同一个 /24**。
#
# ⚠️ 也不要写 `host.docker.internal`：compose 里配的 `extra_hosts: host.docker.internal:host-gateway`
#    只对 **Docker Desktop** 才等于「Windows 主机」；原生 Docker Engine（本仓的 Linux VM 就是）
#    会把它解析成 **Linux VM 自己**的网关，指向的仍然是那台 Linux，不是 Windows。
#
# ⚠️ 第 11 步落地后，`shopsage-api` 这个 job **默认打开**（在此之前它是注释状态，
#    理由写在原注释里：metrics_server 尚未实现时打开只会让 Prometheus 一直刷 target down）。
#    `/metrics` 的路径不在 `API_PREFIX` 下（`app/api/health.py` 的口径），
#    所以 `metrics_path` 必须是 `/metrics` 而不是 `/api/metrics`。

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    env: dev
    project: shopsage

# 记录规则：把最常用的分位数**预先算好**。
#
# 为什么需要它们（而不是每条看板自己写 `histogram_quantile(...)`）：
#   ① 看板里重复写表达式必然漂移（同一张图里两个面板的 P99 算法不一样，没人会发现）；
#   ② 第 11 步的验收口径是「**按 Agent 分组的 P99**」，而这条表达式有 3 个标签维度、
#      手写极易漏掉 `sum by` 的分组键 —— 漏了的症状是「每个节点都显示全局 P99」，
#      图上看起来完全正常，只是永远定位不到瓶颈（B1 会假装被解决了）。
# 指标名与 `app/observability/metrics.py` 里的常量**必须一致**（那里是唯一真相）。
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus 自采：既验证配置生效，也是 Grafana 上「没数据」时的第一手对照
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 业务 API（第 11 步启用）：HTTP 黄金指标 + 节点/LLM/SQL/检索埋点都在这一个端点上。
  #
  # ⚠️ 单副本口径：`--workers 4` 时每个进程各报一份计数，Prometheus 抓到 4 条序列
  #    （`instance` 标签不同），**查询时必须 `sum by (...)`** —— 这正是 `rules/` 里的
  #    记录规则帮你做掉的事。直接看裸序列会把「4 个副本各 3 次」误读成「一共 3 次」。
  - job_name: shopsage-api
    metrics_path: /metrics
    static_configs:
      # ⚠️ 这里**必须写死地址**，不要用 `${...}` —— 实测过两次，结论是：
      #   本仓钉的 prom/prometheus:v2.55.1 **不会**替换 scrape 目标里的环境变量。
      #   * 官方文档（2.55 的 feature_flags）里 `expand-external-labels` 只作用在
      #     `external_labels` 上；该 flag 在 3.0 被移除后才成为默认行为
      #     （见 Prometheus 3.0 迁移指南）—— 也就是说 2.x 的 static_configs 不参与展开。
      #   * 两种写法的症状（都会让 target 永久 down，且**配置本身合法、日志干净**）：
      #       "${VAR:-1.2.3.4:8000}" → 整个字面量当主机名，lastError: invalid port ":8000%7D"
      #       "${VAR}"               → 展开成空主机名，scrapeUrl 变成 http://:80/metrics，
      #                                lastError: invalid URL escape "%7B"
      #     （`%7B`/`%7D` 就是 `{`/`}` 的 URL 编码，是「没替换成功」的指纹。）
      #   * 改地址的两种情形（**看你在哪儿跑业务**）：
      #       ① 业务在 Windows 开发者机（本仓开发拓扑）→ 写 Windows 在 VMware 网段的网卡 IP，
      #          即下面这个 192.168.1.13:8000。它必须与 Linux 的 ens33 同网段。
      #       ② 业务也搬到 Linux VM 上跑（.env 里 host 改回 localhost）→ 写 172.18.0.1:8000，
      #          即**容器 `ip route` 里 `default via` 那个地址**（compose 自定义网桥的网关，
      #          不是 docker0 的 172.17.0.1）。
      #   * 想让地址可配置：部署期生成/替换这个文件，或升级到 Prometheus 3.x ——
      #     **不是**在这里写 `${...}`。scripts/check_infra.py 会把这类写法直接判为错误。
      - targets: ["192.168.1.13:8000"]
        labels:
          service: api

  # OTel Collector 自身的指标（第 11 步起 collector 是可选项，所以默认注释）
  # 打开它才能回答「采集端自己健康吗」—— trace 不到时先看这里，而不是先怀疑业务。
  # - job_name: otel-collector
  #   static_configs:
  #     - targets: ["otel-collector:8888"]
  #       labels:
  #         service: otel-collector

  # Arq worker（第 12 步启用，队列深度/失败数在 B1 验收里要看）
  # ⚠️ 地址口径同上：worker 也跑在 Windows 上，所以用 Windows 的 VMware 网卡 IP，
  #    不是 172.17.0.1（那是 docker0，本栈没用它）。
  # - job_name: shopsage-worker
  #   static_configs:
  #     - targets: ["192.168.1.13:9100"]

# ── 本机实测拓扑（2026-10-11 排障时逐条验证过，改地址前先读这段）─────────────
#
#   Windows 开发者机（业务 uv run uvicorn app.main:app --host 0.0.0.0 --port 8000）
#     Ethernet0                192.168.1.13/24      ← 业务实际监听的地址
#   Linux 依赖机（Docker Engine + compose 全套依赖）
#     ens33                    192.168.1.6/24       ← 与 Windows 同 /24，双向可达
#     docker0                  172.17.0.1/16          ← 默认 bridge，**本栈没用它**
#     br-40dcd5210154          172.18.0.1/16          ← compose 自定义网桥，本栈用这张
#   容器内（shopsage-dev-prometheus）
#     `ip route` → default via 172.18.0.1 dev eth0，src 172.18.0.2
#
#   所以「容器 → 172.17.0.1:8000」会走：容器 → 172.18.0.1 → Linux 的 docker0 网卡
#   →（Linux 上没有任何进程听 8000）→ **内核立刻回 RST** → `connection refused`（实测 63ms）。
#   那个 RST 根本没到 Windows，所以查 Windows 防火墙是白费功夫 —— 判据永远是
#   容器里的 `ip route`（网关是谁）+ 对端真实网卡 IP，两边夹出地址。
#
#   验证顺序（每次改完地址都照这个跑）：
#     docker exec shopsage-dev-prometheus wget -qO- -T 3 http://<地址>:8000/metrics | head -5
#     curl -s 'http://localhost:9090/api/v1/targets?state=any' | grep -o '"health":"[a-z]*"' | sort | uniq -c
#     期望：2 个 up
